name: Deploy to EdgeOne Pages

# 一键部署到腾讯云 EdgeOne Pages。
# 用法: 在仓库 Settings → Secrets 中添加 EDGEONE_API_TOKEN (EdgeOne Pages 控制台生成的 API Token),
# 然后推送 main 分支或手动在 Actions 页面点击 Run workflow 即可自动部署。
# 首次运行会自动创建名为 wloc-spoofer 的 Pages 项目(直接上传类型)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EdgeOne CLI
        run: npm install -g edgeone

      - name: Deploy worker/ to EdgeOne Pages
        run: edgeone pages deploy ./worker -n wloc-spoofer -t "$EDGEONE_API_TOKEN"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
